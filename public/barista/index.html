<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Bar · Ebony</title>
<link rel="icon" type="image/svg+xml" href="/icons/barista.svg" />
<!-- Home Screen app icon (iPhone) + app details (Android) -->
<link rel="apple-touch-icon" href="/icons/barista-180.png" />
<link rel="manifest" href="/icons/barista.webmanifest" />
<meta name="theme-color" content="#0e1116" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<link rel="stylesheet" href="/theme.css" />
<link rel="stylesheet" href="barista.css" />
</head>
<body>

  <!-- ================= MAIN APP ================= -->
  <div id="appScreen" class="hidden">

    <header class="barista-header brand-header">
      <div class="header-left brand-slot-left">
        <input type="date" id="completedDateInput" class="compact-date-picker" />
      </div>
      <h1 class="brand"><span class="brand-name">Ebony</span><span class="brand-role">Bar</span></h1>
      <div class="header-right brand-slot-right">
        <button id="muteBtn" class="icon-btn" aria-label="Mute chime">
          <svg id="muteIconOn" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
          <svg id="muteIconOff" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hidden"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="22" y1="9" x2="16" y2="15"></line><line x1="16" y1="9" x2="22" y2="15"></line></svg>
        </button>
        <button id="historyBtn" class="icon-btn" aria-label="Recent Completed" title="Recent Completed">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><path d="M12 11h4"></path><path d="M12 16h4"></path><path d="M8 11h.01"></path><path d="M8 16h.01"></path></svg>
        </button>
        <button id="logoutBtn" class="icon-btn" aria-label="Log out" title="Log out">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        </button>
      </div>
    </header>

    <div class="status-row">
      <div class="stat-pill"><span class="dot" style="background:var(--wait)"></span><span id="pendingCount">0</span> Pending</div>
      <div class="stat-pill"><span class="dot" style="background:var(--prog)"></span><span id="progressCount">0</span> In Progress</div>
    </div>

    <div class="view-toggle">
      <button class="toggle-btn active" data-view="active">Active Queue <span id="activeTabCount"></span></button>
      <button class="toggle-btn" data-view="completed">Recent Completed <span id="completedTabCount"></span></button>
    </div>

    <section id="activeView" class="ticket-grid"></section>
    <section id="completedView" class="ticket-grid hidden"></section>

  </div>

  <!-- ---------------- Ticket details modal (notes / customizations) ---------------- -->
  <div id="detailsModal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header-row">
        <h2 class="modal-title" id="detailsModalTitle">Ticket Details</h2>
        <button type="button" id="detailsCloseBtn" class="icon-btn" aria-label="Close">✕</button>
      </div>
      <div id="detailsBody"></div>
    </div>
  </div>

<script src="/i18n.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="barista.js"></script>
</body>
</html>
