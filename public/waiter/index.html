<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Waiter — Order Board</title>
<link rel="stylesheet" href="/theme.css" />
<link rel="stylesheet" href="waiter.css" />
</head>
<body>

  <!-- ================= LOGIN ================= -->
  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <h1>ORDER BOARD</h1>
      <p class="subtitle">Waiter sign in</p>

      <form id="loginForm">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="username" required />

        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required />

        <button type="submit" class="login-submit">Sign In</button>
        <p class="login-error" id="loginError"></p>
      </form>

      <div class="login-hint">
        Demo login — <strong>waiter@demo.com</strong> / <strong>password123</strong><br/>
        (created by <span class="mono">npm run seed</span>)
      </div>
    </div>
  </div>

  <!-- ================= MAIN APP ================= -->
  <div id="appScreen" class="hidden">

    <header class="app-header">
      <div>
        <h1 class="display-heading app-title">ORDER BOARD</h1>
        <p id="tableStatusLine" class="app-subtitle">Select a table to begin</p>
        <p id="dateDisplay" class="app-subtitle date-line"></p>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <button id="bellBtn" class="icon-btn" aria-label="Notifications">
          🔔<span id="unreadBadge" class="badge hidden">0</span>
        </button>
        <button id="logoutBtn" class="icon-btn" aria-label="Log out" title="Log out">🚪</button>
      </div>
      <div id="notifPanel" class="notif-panel hidden"></div>
    </header>

    <div class="view-toggle">
      <button class="toggle-btn active" data-view="menu">Menu</button>
      <button class="toggle-btn" data-view="orders">My Orders <span id="ordersCount"></span></button>
    </div>

    <!-- ---------------- MENU VIEW ---------------- -->
    <section id="menuView">
      <div class="section-block">
        <p class="section-label">Table</p>
        <div id="tableChips" class="chip-row"></div>
      </div>

      <div id="categoryTabs" class="category-tabs"></div>
      <div id="subCategoryTabs" class="category-tabs subcategory-tabs hidden"></div>
      <div id="subSubCategoryTabs" class="category-tabs subcategory-tabs subsubcategory-tabs hidden"></div>

      <div id="menuGrid" class="menu-grid"></div>

      <p id="noTableWarning" class="no-table-warning hidden">
        Select a table before adding items
      </p>
    </section>

    <!-- ---------------- ORDERS VIEW ---------------- -->
    <section id="ordersView" class="hidden">
      <label class="date-picker-label">
        Day
        <input type="date" id="ordersDateInput" class="date-input" />
      </label>
      <div id="ordersList" class="orders-list"></div>
    </section>

    <!-- ---------------- BASKET ---------------- -->
    <div id="basketSheet" class="basket-sheet hidden">
      <button id="basketToggle" class="basket-summary">
        <span><span id="basketCount">0</span> items · <span id="basketTotal" class="mono">$0.00</span></span>
        <span id="basketChevron">▲</span>
      </button>
      <div id="basketDetail" class="basket-detail hidden">
        <div id="basketItems" class="basket-items"></div>
        <div class="basket-total-row">
          <span>Total</span>
          <span id="basketTotalBig" class="mono">$0.00</span>
        </div>
        <button id="sendOrderBtn" class="send-btn">📨 Send to Barista</button>
      </div>
    </div>

    <div id="toast" class="toast hidden"></div>
  </div>

  <!-- ---------------- Customize item modal ---------------- -->
  <div id="customizeModal" class="modal-overlay hidden">
    <div class="modal-card">
      <h2 class="modal-title" id="customizeItemName">Item</h2>
      <p class="modal-sub" id="customizeItemPrice"></p>

      <div id="temperatureSection" class="customize-section hidden">
        <p class="customize-label">Temperature</p>
        <div id="temperatureOptions" class="option-row"></div>
      </div>

      <div id="ingredientsSection" class="customize-section hidden">
        <p class="customize-label">Remove ingredients</p>
        <div id="ingredientsOptions" class="option-row"></div>
      </div>

      <div id="extrasSection" class="customize-section hidden">
        <p class="customize-label">Extras</p>
        <div id="extrasOptions" class="option-row"></div>
      </div>

      <div class="customize-section">
        <p class="customize-label">Quantity</p>
        <div class="qty-controls">
          <button type="button" id="customizeQtyMinus" class="qty-btn minus">−</button>
          <span class="qty-value" id="customizeQtyValue">1</span>
          <button type="button" id="customizeQtyPlus" class="qty-btn plus">+</button>
        </div>
      </div>

      <div class="modal-actions">
        <button type="button" id="customizeCancelBtn" class="secondary-btn">Cancel</button>
        <button type="button" id="customizeAddBtn" class="primary-btn">Add — <span id="customizeAddTotal" class="mono">$0.00</span></button>
      </div>
    </div>
  </div>

  <!-- ---------------- Order details modal ---------------- -->
  <div id="orderDetailsModal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header-row">
        <h2 class="modal-title">Order Details</h2>
        <button type="button" id="orderDetailsCloseBtn" class="icon-btn" aria-label="Close">✕</button>
      </div>
      <div id="orderDetailsBody"></div>
    </div>
  </div>

<script src="/socket.io/socket.io.js"></script>
<script src="waiter.js"></script>
</body>
</html>
