<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Order Board</title>
<link rel="stylesheet" href="/theme.css" />
<style>
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  .home {
    width: 100%;
    max-width: 420px;
  }
  .home h1 {
    font-family: var(--font-display);
    font-size: 48px;
    letter-spacing: 1px;
    margin: 0;
  }
  .home .subtitle {
    color: var(--text-muted);
    margin: 4px 0 24px;
  }
  .screen-link {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 18px;
    margin-bottom: 10px;
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 14px;
    color: var(--text-main);
    text-decoration: none;
    transition: border-color 0.15s, background 0.15s;
  }
  .screen-link:hover {
    border-color: var(--signal);
    background: var(--surface-raised);
  }
  .screen-link .icon {
    font-size: 26px;
  }
  .screen-link strong {
    display: block;
    font-size: 16px;
  }
  .screen-link span {
    color: var(--text-muted);
    font-size: 13px;
  }
</style>
</head>
<body>
  <main class="home">
    <h1>ORDER BOARD</h1>
    <p class="subtitle">Choose your screen</p>

    <a class="screen-link" href="/waiter/">
      <div class="icon">📝</div>
      <div><strong>Waiter</strong><span>Take orders at the table</span></div>
    </a>
    <a class="screen-link" href="/barista/">
      <div class="icon">☕</div>
      <div><strong>Barista</strong><span>Drink orders as they come in</span></div>
    </a>
    <a class="screen-link" href="/chef/">
      <div class="icon">🍳</div>
      <div><strong>Chef</strong><span>Food orders as they come in</span></div>
    </a>
    <a class="screen-link" href="/cashier/">
      <div class="icon">💵</div>
      <div><strong>Cashier</strong><span>Take payments</span></div>
    </a>
    <a class="screen-link" href="/admin/">
      <div class="icon">📊</div>
      <div><strong>Manager</strong><span>Revenue, orders, staff, menu</span></div>
    </a>
  </main>
</body>
</html>
