<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Sign In · Ebony</title>
<link rel="icon" type="image/svg+xml" href="/icons/admin.svg" />
<meta name="theme-color" content="#0e1116" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<link rel="stylesheet" href="/theme.css" />
<link rel="stylesheet" href="login.css" />
</head>
<body>

  <!-- One sign-in page for every screen. The role picked below decides
       which screen you land on after signing in (see login.js). -->
  <div class="login-screen">
    <div class="login-card">
      <h1 class="brand"><span class="brand-name">Ebony</span><span class="brand-role" id="brandRole">Waiter</span></h1>
      <p class="subtitle" id="loginSubtitle">Waiter sign in</p>

      <div class="role-picker" id="rolePicker" role="radiogroup" aria-label="Sign in as">
        <button type="button" class="role-option" role="radio" data-screen="manager">Manager</button>
        <button type="button" class="role-option" role="radio" data-screen="cashier">Cashier</button>
        <button type="button" class="role-option" role="radio" data-screen="chef">Chef</button>
        <button type="button" class="role-option" role="radio" data-screen="barista">Barista</button>
        <button type="button" class="role-option" role="radio" data-screen="waiter">Waiter</button>
      </div>

      <form id="loginForm">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="username" required />

        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required />

        <button type="submit" class="login-submit" id="loginSubmit">Sign In</button>
        <p class="login-error" id="loginError" role="alert"></p>
      </form>

      <div class="login-hint hidden" id="loginHint"></div>
    </div>
  </div>

<script src="/i18n.js"></script>
<script src="login.js"></script>
</body>
</html>
