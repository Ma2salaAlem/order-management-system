# One-click hosting on Render (https://render.com): New → Blueprint → pick
# this repo. Creates the web app plus a Postgres database, generates
# JWT_SECRET, runs migrations, and seeds demo data on the first boot.
services:
  - type: web
    name: order-management-system
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npx prisma migrate deploy && node src/seedIfEmpty.js && node src/server.js
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: order-management-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: "*"

databases:
  - name: order-management-db
    plan: free
    region: frankfurt
